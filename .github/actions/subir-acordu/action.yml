name: Subir o Acordu
description: >
  Compila e sobe a API (migrations aplicadas, porta 5080) e compila o front com o Chromium do Playwright, para a fumaça
  (CI) e o bot das capturas do manual (Ajuda). O job precisa dos serviços postgres (5434) e mailpit (1025/8025).

runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json

    - uses: ./.github/actions/cache-nuget

    - uses: pnpm/action-setup@v4
      with:
        package_json_file: apps/web/package.json

    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
        cache-dependency-path: apps/web/pnpm-lock.yaml

    - name: Compilar a API
      shell: bash
      run: |
        set -o pipefail
        dotnet tool restore
        dotnet build src/Acordu.Api --configuration Release 2>&1 | tee build.log

    - name: Aplicar as migrations
      shell: bash
      run: >
        dotnet ef database update --no-build --configuration Release
        --project src/Acordu.Infrastructure --startup-project src/Acordu.Api

    - name: Subir a API
      shell: bash
      env:
        ASPNETCORE_ENVIRONMENT: Development
        # Login, cadastro e afins passam de 10 por minuto do mesmo IP na fumaça (a renovação já tem limite próprio).
        RateLimit__Auth__PorMinuto: "1000"
      run: |
        nohup dotnet run --project src/Acordu.Api --configuration Release --no-build --no-launch-profile \
          --urls http://localhost:5080 > api.log 2>&1 &
        for i in $(seq 1 60); do
          curl -fsS http://localhost:5080/api/health && exit 0
          sleep 1
        done
        echo "::error::A API não respondeu em 60 s." && cat api.log && exit 1

    - name: Instalar o front
      shell: bash
      working-directory: apps/web
      run: pnpm install --frozen-lockfile

    - name: Compilar o front
      shell: bash
      working-directory: apps/web
      run: pnpm build

    # O navegador fica em cache pela versão instalada do Playwright (não pelo lockfile inteiro, que muda com qualquer
    # dependência); as dependências do sistema (apt) não cabem no cache e são instaladas sempre.
    - name: Versão do Playwright
      id: versao-playwright
      shell: bash
      working-directory: apps/web
      run: echo "versao=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

    - name: Cache do Chromium do Playwright
      id: cache-playwright
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.versao-playwright.outputs.versao }}

    - name: Instalar o Chromium do Playwright
      shell: bash
      working-directory: apps/web
      env:
        EM_CACHE: ${{ steps.cache-playwright.outputs.cache-hit }}
      run: |
        if [[ "$EM_CACHE" == "true" ]]; then
          pnpm exec playwright install-deps chromium
        else
          pnpm exec playwright install --with-deps chromium
        fi
