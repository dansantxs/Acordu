name: CI

# Economia de minutos (spec do F8, F8-01 a F8-05): branch de feature roda só pelo PR (o push dela não roda de novo);
# no PR, cada job só quando a área dele muda (job pulado conta como verde); na main roda tudo, como base do deploy.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Na main não cancela: dois merges seguidos precisam dos dois runs (base do deploy).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  mudancas:
    name: O que mudou
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filtro.outputs.backend == 'true' || github.event_name != 'pull_request' }}
      web: ${{ steps.filtro.outputs.web == 'true' || github.event_name != 'pull_request' }}
      imagem: ${{ steps.filtro.outputs.imagem == 'true' || github.event_name != 'pull_request' }}
      borda: ${{ steps.filtro.outputs.borda == 'true' || github.event_name != 'pull_request' }}
      acoes: ${{ steps.filtro.outputs.acoes == 'true' || github.event_name != 'pull_request' }}
      specs: ${{ steps.filtro.outputs.specs == 'true' || github.event_name != 'pull_request' }}
    steps:
      # No pull_request o filtro lista os arquivos pela API (pull-requests: read); não precisa de checkout.
      - uses: dorny/paths-filter@v3
        id: filtro
        if: github.event_name == 'pull_request'
        with:
          # A própria CI, a ação comum e as regras de estilo (analisadores do .NET e Prettier) fazem tudo rodar.
          filters: |
            pipeline: &pipeline
              - .github/workflows/ci.yml
              # Só a ação que sobe o Acordu: o aviso do Discord tem o job próprio ("Ações").
              - .github/actions/subir-acordu/**
              - .editorconfig
              - .gitattributes
            backend:
              - *pipeline
              - src/**
              - tests/**
              - "*.sln"
              - global.json
              - Directory.*.props
              - .config/**
              # O ContratoOpenApiTests confere a API contra openapi/*.json.
              - openapi/**
              - scripts/bundle-migrations.sh
            web:
              - *pipeline
              - apps/web/**
              - openapi/**
            # A imagem só muda com o código da API ou com o Dockerfile (spec do F8, F8-16).
            imagem:
              - *pipeline
              - src/**
              - "*.sln"
              - global.json
              - Directory.*.props
              - docker/**
              - .dockerignore
            # Aviso do Discord dos workflows (ADR 0012, F13g).
            acoes:
              - .github/actions/avisar-discord/**
              - .github/workflows/ci.yml
            # Estrutura das specs e garantias da fábrica (docs/processo.md; P1-06 a P1-08, P1-20 a P1-22).
            specs:
              - docs/specs/**
              - scripts/conferir-*
              - scripts/rotulos*
              - docs/processo.md
              - .claude/**
              - .github/workflows/ci.yml
            # Worker de api.acordu.app.br (spec do F8, F8-23 a F8-25).
            borda:
              - *pipeline
              - infra/cloudflare/**

  acoes:
    name: Ações (aviso do Discord)
    needs: mudancas
    if: needs.mudancas.outputs.acoes == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      - name: Testes do avisar.sh
        run: bash .github/actions/avisar-discord/avisar.test.sh

  specs:
    name: Specs
    needs: mudancas
    if: needs.mudancas.outputs.specs == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            docs/specs
            docs/processo.md
            scripts
            .claude
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testes do conferir-specs e garantias da fábrica
        run: node --test scripts/conferir-specs.test.mjs scripts/conferir-fabrica.test.mjs
      - name: Testes do rotulos.sh
        run: bash scripts/rotulos.test.sh
      - name: Estrutura das specs
        run: node scripts/conferir-specs.mjs

  backend:
    name: Backend (.NET)
    needs: mudancas
    if: needs.mudancas.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Antes do restore, no checkout limpo como o do deploy: o bundle tem que se virar sozinho (#180).
      - name: Bundle das migrations (o mesmo do deploy)
        run: bash scripts/bundle-migrations.sh "$RUNNER_TEMP/efbundle"

      - name: Restore
        run: |
          set -o pipefail
          dotnet restore Acordu.sln 2>&1 | tee restore.log

      - name: Build
        run: |
          set -o pipefail
          dotnet build Acordu.sln --configuration Release --no-restore 2>&1 | tee build.log

      - name: Test
        run: >
          dotnet test Acordu.sln --configuration Release --no-build
          --logger "trx" --results-directory TestResults

      - name: Anotar erros de restore e build
        if: failure()
        shell: python
        run: |
          # Erros de NuGet não casam com o problem matcher do setup-dotnet; os logs não são baixáveis pela sessão.
          import glob
          vistos = set()
          for arquivo in glob.glob("*.log"):
              for linha in open(arquivo, encoding="utf-8", errors="replace"):
                  if ": error " in linha and linha not in vistos and len(vistos) < 40:
                      vistos.add(linha)
                      print("::error title=" + arquivo + "::" + linha.strip().replace("%", "%25")[:1800])

      - name: Anotar testes que falharam
        if: failure()
        shell: python
        run: |
          # Cada teste que falhou vira uma annotation do check run (legível pela API, sem baixar artefatos).
          import glob, xml.etree.ElementTree as ET
          ns = {"t": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}
          falhas = 0
          for arquivo in glob.glob("TestResults/**/*.trx", recursive=True):
              for r in ET.parse(arquivo).getroot().iterfind(".//t:UnitTestResult", ns):
                  if r.get("outcome") != "Failed" or falhas >= 40:
                      continue
                  falhas += 1
                  msg = r.findtext(".//t:ErrorInfo/t:Message", default="", namespaces=ns)
                  pilha = r.findtext(".//t:ErrorInfo/t:StackTrace", default="", namespaces=ns)
                  texto = (msg.strip() + " | " + " ".join(pilha.split())[:600]).replace("%", "%25").replace("\r", "").replace("\n", "%0A")
                  print(f"::error title={r.get('testName')}::{texto[:1800]}")
          print(f"{falhas} teste(s) com falha anotado(s).")

      - name: Publicar resultados dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-testes
          path: TestResults
          if-no-files-found: ignore

  web:
    name: Web (React)
    needs: mudancas
    if: needs.mudancas.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Instalar
        run: pnpm install --frozen-lockfile

      - name: Tipos do OpenAPI atualizados
        run: |
          pnpm api:tipos
          git diff --exit-code -- src/shared/api || (echo "::error::Tipos desatualizados: rode pnpm api:tipos (ou peça pelo workflow OpenAPI)." && exit 1)

      - name: Formato
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Tipos
        run: pnpm typecheck

      - name: Testes
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: CSP do Pages com o hash do script inline
        run: pnpm csp:conferir

  e2e:
    name: E2E (Playwright)
    needs: mudancas
    # A fumaça depende da API e do SPA: roda quando qualquer um dos dois muda.
    if: needs.mudancas.outputs.backend == 'true' || needs.mudancas.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      # Mesmas credenciais do docker-compose.dev e do appsettings.Development (porta 5434).
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: acordu
          POSTGRES_PASSWORD: acordu_dev
          POSTGRES_DB: acordu
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U acordu" --health-interval 5s --health-timeout 5s --health-retries 10
      # Os e-mails da fumaça (confirmação do cadastro) vão para o Mailpit, como no desenvolvimento.
      mailpit:
        image: axllent/mailpit:v1.31.5
        ports: ["1025:1025", "8025:8025"]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/subir-acordu

      - name: Fumaça
        working-directory: apps/web
        run: pnpm e2e

      - name: Anotar erros da API
        if: failure()
        shell: python
        run: |
          # O log da API não é baixável pela sessão: erros e exceções viram annotations do check run.
          import os
          if os.path.exists("api.log"):
              linhas = open("api.log", encoding="utf-8", errors="replace").read().splitlines()
              for i, linha in enumerate(linhas):
                  if linha.startswith(("fail:", "crit:")) or "Exception" in linha:
                      trecho = " | ".join(l.strip() for l in linhas[i:i + 6])
                      print("::error title=api.log::" + trecho.replace("%", "%25")[:1800])

      - name: Publicar o relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-playwright
          path: apps/web/playwright-report
          if-no-files-found: ignore

  imagem:
    name: Imagem da API
    needs: mudancas
    if: needs.mudancas.outputs.imagem == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Construir (linux/amd64)
        run: docker build --platform linux/amd64 -f docker/api.Dockerfile -t acordu-api:ci .

      - name: Sem root
        run: |
          usuario=$(docker image inspect acordu-api:ci --format '{{.Config.User}}')
          echo "Usuário da imagem: ${usuario:-(vazio)}"
          if [[ -z "$usuario" || "$usuario" == "root" || "$usuario" == "0" ]]; then
            echo "::error::A imagem roda como root."
            exit 1
          fi

      # Sem banco: /api/health não o consulta. A API confere fuso e ICU ao subir (AmbienteDeExecucao): se faltarem,
      # ela nem sobe e o health não responde.
      - name: Fumaça
        run: |
          docker run -d --name api -p 8080:8080 \
            -e ConnectionStrings__Acordu="Host=localhost;Database=acordu;Username=fumaca;Password=fumaca" \
            -e Jwt__ChaveAssinatura="chave-da-fumaca-da-imagem-com-mais-de-32-bytes" \
            acordu-api:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/api/health && exit 0
            # Container que morreu ao subir (fuso ou ICU ausente) não precisa esperar os 30 s.
            [[ "$(docker inspect -f '{{.State.Running}}' api)" == "true" ]] || break
            sleep 1
          done
          echo "::error::A imagem não respondeu /api/health: $(docker logs api 2>&1 | tail -c 1500 | tr '\n' ' ')"
          exit 1

  borda:
    name: Worker (${{ matrix.worker }})
    needs: mudancas
    if: needs.mudancas.outputs.borda == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # A borda da API (F8) e a vigia (F13h): mesmas ferramentas, cada uma com o seu lockfile.
    strategy:
      fail-fast: false
      matrix:
        worker: [api-borda, vigia]
    defaults:
      run:
        working-directory: infra/cloudflare/${{ matrix.worker }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: infra/cloudflare/${{ matrix.worker }}/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: infra/cloudflare/${{ matrix.worker }}/pnpm-lock.yaml

      - name: Instalar
        run: pnpm install --frozen-lockfile

      - name: Tipos
        run: pnpm typecheck

      - name: Testes
        run: pnpm test

      # Empacota como no deploy, sem publicar (não precisa de credencial).
      - name: Empacotar
        run: pnpm exec wrangler deploy --dry-run --outdir dist

  # Um check só para a proteção da main: job pulado conta como verde, então sem este um erro no "O que mudou" deixaria
  # tudo pulado e o PR aparentemente aprovado.
  ci-ok:
    name: CI ok
    needs: [mudancas, acoes, specs, backend, web, e2e, imagem, borda]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Algum job falhou ou foi cancelado?
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::Algum job da CI falhou ou foi cancelado."
          exit 1
      - run: echo "CI ok"
