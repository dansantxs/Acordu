name: Deploy

# Produção do nível 0 (ADR 0010; deploy-ci-acordu-v1.md §4). Disparo manual, só na main, até haver cliente pagante
# (spec do F8, decisão 1): Actions → Deploy → Run workflow. Ordem: CI verde no commit → imagem → migrations → nova
# revisão → health pela borda (falhou: tráfego volta à anterior) → Worker → SPA → vigia → Discord.
# Nomes de variáveis e segredos do repositório: setup-infra-acordu.md, "Segredos do GitHub".

on:
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGIAO: us-east4
  SERVICO: acordu-api
  BORDA: https://api.acordu.app.br
  # BORDA_ATIVA=true (variável do repositório) depois que o Worker aponta para o serviço (runbook C4). Até lá, o health
  # é conferido direto na URL *.run.app, com o token de origem.
  BORDA_ATIVA: ${{ vars.BORDA_ATIVA }}

jobs:
  deploy:
    name: Deploy de produção
    # Em outra branch o job nem começa (sem aviso no Discord). Não é barreira de segurança: o YAML que roda é o da
    # branch escolhida (risco registrado no deploy-ci §7).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Primeiro, para o aviso do Discord (a action local) existir mesmo quando o passo seguinte barra o deploy.
      - uses: actions/checkout@v4

      # O disparo manual não espera a CI: sem o "CI ok" verde neste commit, não publica.
      - name: CI verde neste commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          resultado=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=CI%20ok" \
            --jq '[.check_runs[] | select(.app.slug == "github-actions")][0].conclusion // "ausente"')
          echo "CI ok em ${GITHUB_SHA:0:7}: $resultado"
          if [[ "$resultado" != "success" ]]; then
            echo "::error::A CI deste commit não está verde ($resultado). Espere o run da main terminar."
            exit 1
          fi

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
          service_account: acordu-deployer@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Imagem (build e push)
        id: imagem
        env:
          PROJETO: ${{ vars.GCP_PROJECT_ID }}
        run: |
          imagem="$REGIAO-docker.pkg.dev/$PROJETO/acordu/acordu-api:$GITHUB_SHA"
          gcloud auth configure-docker "$REGIAO-docker.pkg.dev" --quiet
          docker build --platform linux/amd64 -f docker/api.Dockerfile -t "$imagem" .
          docker push "$imagem"
          echo "imagem=$imagem" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Bundle do EF Core no endpoint direto do Neon, com acordu_migrator (a fábrica de design lê ACORDU_CONNECTION).
      # Falhou: para aqui, e a produção segue na revisão anterior (F8-27).
      - name: Migrations
        env:
          ACORDU_CONNECTION: ${{ secrets.NEON_MIGRATOR }}
        run: |
          if [[ -z "$ACORDU_CONNECTION" ]]; then echo "::error::Falta o secret NEON_MIGRATOR."; exit 1; fi
          dotnet tool restore
          dotnet ef migrations bundle --project src/Acordu.Infrastructure --startup-project src/Acordu.Api \
            --configuration Release --output "$RUNNER_TEMP/efbundle" --force
          "$RUNNER_TEMP/efbundle"

      - name: Revisão em produção antes do deploy
        id: anterior
        # Só "serviço não existe" conta como primeiro deploy; qualquer outro erro do describe para o deploy (senão um
        # erro de permissão desligaria o rollback).
        run: |
          if anterior=$(gcloud run services describe "$SERVICO" --region "$REGIAO" \
              --format='value(status.traffic[0].revisionName)' 2> "$RUNNER_TEMP/describe.err"); then
            echo "Revisão anterior: $anterior"
          elif grep -qiE 'NOT_FOUND|could not be found|cannot find' "$RUNNER_TEMP/describe.err"; then
            anterior=""
            echo "Serviço ainda não existe: primeiro deploy."
          else
            cat "$RUNNER_TEMP/describe.err"
            echo "::error::Não deu para ler o serviço no Cloud Run."
            exit 1
          fi
          echo "revisao=$anterior" >> "$GITHUB_OUTPUT"

      # Variáveis em arquivo (as connection strings têm ';' e '=' e quebrariam o --set-env-vars). O arquivo substitui
      # todas as variáveis da revisão: a configuração é a deste workflow, não a do painel.
      - name: Variáveis da API
        env:
          ConnectionStrings__Acordu: ${{ secrets.API_CONNECTION_STRING }}
          Jwt__ChaveAssinatura: ${{ secrets.API_JWT_CHAVE }}
          Jobs__Token: ${{ secrets.API_JOBS_TOKEN }}
          Proxy__TokenOrigem: ${{ secrets.API_TOKEN_ORIGEM }}
          Email__ResendChave: ${{ secrets.API_RESEND_CHAVE }}
          Turnstile__Segredo: ${{ secrets.API_TURNSTILE_SEGREDO }}
          # Só conferida aqui (vai para o build do SPA, não para a API): falta dela barra o deploy antes de publicar.
          TURNSTILE_CHAVE_SITE: ${{ vars.TURNSTILE_CHAVE_SITE }}
          Armazenamento__Endpoint: ${{ secrets.R2_ENDPOINT }}
          Armazenamento__ChaveAcesso: ${{ secrets.API_R2_CHAVE_ACESSO }}
          Armazenamento__ChaveSecreta: ${{ secrets.API_R2_CHAVE_SECRETA }}
          # Avisos de operação da API (ADR 0012): os mesmos webhooks dos workflows; sem, o canal não envia.
          Discord__Alertas: ${{ secrets.DISCORD_ALERTAS }}
          Discord__Deploy: ${{ secrets.DISCORD_DEPLOY }}
          Discord__Sugestoes: ${{ secrets.DISCORD_SUGESTOES }}
          Operacao__LinkErros: ${{ vars.OPERACAO_LINK_ERROS }}
        run: |
          python3 - "$RUNNER_TEMP/env-api.yaml" <<'PY'
          import json, os, sys

          fixas = {
              "Cors__Origem": "https://acordu.app.br",
              "App__UrlPublica": "https://acordu.app.br/",
              "App__UrlApi": "https://api.acordu.app.br/",
              "Proxy__ConfiarEncaminhamento": "true",
              "Proxy__Saltos": "2",
              "TempoReal__Sse": "false",
              "Armazenamento__Regiao": "auto",
              "Armazenamento__Bucket": "acordu-anexos",
              # Logs JSON para o Cloud Logging e o Error Reporting; a versão é o commit (ADR 0012, F13a).
              "Logs__Formato": "json",
              "App__Versao": os.environ["GITHUB_SHA"][:7],
          }
          # Turnstile__Segredo: sem ele o cadastro público fica sem desafio (RNF-SEG-10; spec do F9, F9-46).
          obrigatorias = ["ConnectionStrings__Acordu", "Jwt__ChaveAssinatura", "Jobs__Token", "Proxy__TokenOrigem",
                          "Email__ResendChave", "Turnstile__Segredo"]
          # Sem endpoint do R2, a API sobe sem anexos (ComposicaoApi); com ele, as chaves são obrigatórias.
          opcionais = ["Armazenamento__Endpoint", "Armazenamento__ChaveAcesso", "Armazenamento__ChaveSecreta"]
          # Sem webhook, o canal não envia (a API sobe igual); sem o link, o aviso de erro sai sem ele.
          webhooks = ["Discord__Alertas", "Discord__Deploy", "Discord__Sugestoes"]
          avisos = webhooks + ["Operacao__LinkErros"]

          faltam = [n for n in obrigatorias if not os.environ.get(n, "").strip()]
          if not os.environ.get("TURNSTILE_CHAVE_SITE", "").strip():
              faltam.append("TURNSTILE_CHAVE_SITE (variável, runbook C5)")
          if os.environ.get("Armazenamento__Endpoint"):
              faltam += [n for n in opcionais[1:] if not os.environ.get(n)]
          # A API não sobe com webhook fora de https (OpcoesDiscord): melhor barrar aqui, antes de publicar.
          faltam += [n + " (precisa ser https://)" for n in webhooks
                     if os.environ.get(n, "").strip() and not os.environ[n].strip().startswith("https://")]
          if faltam:
              sys.exit("Faltam: " + ", ".join(faltam))

          variaveis = dict(fixas)
          variaveis.update({n: os.environ[n] for n in obrigatorias + opcionais + avisos if os.environ.get(n)})
          if "Armazenamento__Endpoint" not in variaveis:
              for n in ("Armazenamento__Regiao", "Armazenamento__Bucket"):
                  variaveis.pop(n)
          caminho = sys.argv[1]
          with open(os.open(caminho, os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600), "w") as f:
              json.dump(variaveis, f)  # JSON é YAML válido.
          print("Variáveis:", ", ".join(sorted(variaveis)))
          sem = [n for n in webhooks if n not in variaveis]
          if sem:
              print("::warning::Sem " + ", ".join(sem) + ": esses canais do Discord não recebem avisos da API.")
          PY

      # Parâmetros do deploy-ci §2.2. O --to-latest desfaz um rollback anterior, que fixa o tráfego numa revisão.
      - name: Nova revisão
        env:
          PROJETO: ${{ vars.GCP_PROJECT_ID }}
          IMAGEM: ${{ steps.imagem.outputs.imagem }}
        run: |
          gcloud run deploy "$SERVICO" --image "$IMAGEM" --region "$REGIAO" \
            --service-account "acordu-api@$PROJETO.iam.gserviceaccount.com" \
            --cpu 1 --memory 512Mi --min-instances 0 --max-instances 2 --cpu-boost --port 8080 \
            --allow-unauthenticated --env-vars-file "$RUNNER_TEMP/env-api.yaml" --quiet
          gcloud run services update-traffic "$SERVICO" --region "$REGIAO" --to-latest --quiet
          rm -f "$RUNNER_TEMP/env-api.yaml"

      # Pela borda (F8-26, F8-28) com BORDA_ATIVA=true; antes disso (primeiro deploy, runbook C4 ainda por fazer),
      # direto na URL *.run.app, com o token de origem. O rollback independe do caminho: há revisão anterior, volta.
      - name: Health
        env:
          ANTERIOR: ${{ steps.anterior.outputs.revisao }}
          TOKEN_ORIGEM: ${{ secrets.API_TOKEN_ORIGEM }}
        run: |
          if [[ "$BORDA_ATIVA" == "true" ]]; then
            url="$BORDA/api/health"; cabecalho=()
          else
            url="$(gcloud run services describe "$SERVICO" --region "$REGIAO" --format='value(status.url)')/api/health"
            cabecalho=(-H "X-Origem-Token: $TOKEN_ORIGEM")
          fi
          for i in $(seq 1 10); do
            curl -fsS --max-time 20 "${cabecalho[@]}" "$url" && exit 0
            sleep 5
          done
          echo "::error::$url não respondeu."
          if [[ -n "$ANTERIOR" ]]; then
            gcloud run services update-traffic "$SERVICO" --region "$REGIAO" --to-revisions "$ANTERIOR=100" --quiet
            echo "::error::Tráfego de volta para $ANTERIOR."
          fi
          exit 1

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: infra/cloudflare/api-borda/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            infra/cloudflare/api-borda/pnpm-lock.yaml
            infra/cloudflare/vigia/pnpm-lock.yaml
            apps/web/pnpm-lock.yaml

      # keep_vars no wrangler.toml: ORIGEM e TOKEN_ORIGEM, definidos no painel, ficam como estão.
      - name: Worker da borda
        working-directory: infra/cloudflare/api-borda
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm install --frozen-lockfile
          pnpm exec wrangler deploy

      - name: SPA (build)
        working-directory: apps/web
        env:
          VITE_URL_API: https://api.acordu.app.br
          VITE_TEMPO_REAL: polling
          # Chave do site do Turnstile (pública), conferida no passo "Variáveis da API", antes de publicar.
          VITE_TURNSTILE_CHAVE: ${{ vars.TURNSTILE_CHAVE_SITE }}
          # Vai junto dos relatos de erro do app (F13d); sem ela o app não relata.
          VITE_VERSAO: ${{ github.sha }}
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      # Usa o wrangler da borda (versão travada no lockfile dela), rodando em apps/web para não ler o wrangler.toml
      # do Worker. O projeto é criado no primeiro deploy.
      - name: SPA (Pages)
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler="$GITHUB_WORKSPACE/infra/cloudflare/api-borda/node_modules/.bin/wrangler"
          if ! "$wrangler" pages project list | grep -qE '(^|[^a-z0-9-])acordu-web([^a-z0-9-]|$)'; then
            "$wrangler" pages project create acordu-web --production-branch main
          fi
          "$wrangler" pages deploy dist --project-name acordu-web --branch main --commit-hash "$GITHUB_SHA"

      # Vigia da API (ADR 0012, F13h), por último: o monitor não segura o produto (falhou, avisa e o deploy segue).
      # O KV ESTADO é criado no primeiro deploy (provisionamento do wrangler) e segue ligado depois. O webhook de
      # #alertas vai como segredo do Worker; sem ele, a vigia só registra no log.
      - name: Vigia
        id: vigia
        continue-on-error: true
        working-directory: infra/cloudflare/vigia
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DISCORD_ALERTAS: ${{ secrets.DISCORD_ALERTAS }}
        run: |
          pnpm install --frozen-lockfile
          pnpm exec wrangler deploy
          if [[ -n "$DISCORD_ALERTAS" ]]; then
            printf '%s' "$DISCORD_ALERTAS" | pnpm exec wrangler secret put DISCORD_ALERTAS > /dev/null
            echo "Webhook de #alertas na vigia."
          else
            echo "::warning::Sem DISCORD_ALERTAS: a vigia não avisa a queda da API."
          fi

      - name: Vigia não publicou
        if: steps.vigia.outcome == 'failure'
        run: echo "::warning::A vigia não foi publicada; a API e o SPA estão no ar. Veja o passo Vigia."

      # Sucesso em #deploy, falha em #alertas (ADR 0012, F13-31).
      - name: Discord
        if: always()
        uses: ./.github/actions/avisar-discord
        with:
          status: ${{ job.status }}
          ok: "**Deploy ok** · `${{ github.sha }}`"
          falha: "**Deploy falhou** (${{ job.status }}) em `${{ github.sha }}`: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          deploy: ${{ secrets.DISCORD_DEPLOY }}
          alertas: ${{ secrets.DISCORD_ALERTAS }}
