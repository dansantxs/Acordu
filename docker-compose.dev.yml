# Ambiente local de desenvolvimento: só o que a API precisa para rodar e testar.
# O object storage local (para anexos) entra no marco de anexos.
name: acordu-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: acordu
      POSTGRES_USER: acordu
      POSTGRES_PASSWORD: acordu_dev   # só desenvolvimento local
    ports:
      - "5432:5432"
    volumes:
      - acordu-dev-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acordu -d acordu"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  acordu-dev-pg:
