name: acordu

services:
  postgres:
    image: postgres:17
    container_name: acordu-postgres
    environment:
      POSTGRES_DB: acordu
      POSTGRES_USER: acordu
      POSTGRES_PASSWORD: acordu_dev
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Emulador S3 local para os anexos (as imagens públicas do MinIO deixaram de ser distribuídas). A API já aponta para
  # cá no appsettings.Development (http://localhost:9090, us-east-1, chaves quaisquer). Sem persistência.
  s3:
    image: adobe/s3mock:5.2.2
    container_name: acordu-s3
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: acordu-anexos
    ports:
      - "9090:9090"

  # Caixa de e-mail falsa (decidido em 16/10): a API manda por SMTP para cá no desenvolvimento
  # (Email__Smtp__Host=localhost, já no appsettings.Development) e os e-mails aparecem em http://localhost:8025, com os
  # links clicáveis. Nada sai para a internet. Sem persistência.
  mailpit:
    image: axllent/mailpit:v1.31.5
    container_name: acordu-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
