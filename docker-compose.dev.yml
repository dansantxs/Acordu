name: acordu

services:
  postgres:
    image: postgres:17
    container_name: acordu-postgres
    environment:
      POSTGRES_DB: acordu
      POSTGRES_USER: acordu
      POSTGRES_PASSWORD: acordu_dev
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
